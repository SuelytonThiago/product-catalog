<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="navbar" id="navbar">
        <p class="logo" id="logo">ClickStore</p>

        <button class="button-theme" id="themeBtn">
          <img src="img/moon_11566671-removebg-preview.png" alt="theme" />
          <p>Mudar tema</p>
        </button>
      </div>
      <div class="catalog">
        <div class="item">
          <div class="product-container">
            <div class="product">
              <div class="images">
                <img src="img/product1/photo1.avif" alt="img1" />
                <img src="img/product1/photo2.avif" alt="img2" />
                <img src="img/product1/photo3.avif" alt="img3" />
              </div>
            </div>
            <button class="left"><</button>
            <button class="right">></button>
          </div>
          <div class="description">
            <p class="legend">Refrigerator</p>
            <p class="price">
              <i class="fa-solid fa-dollar-sign"></i>
              2499,99
            </p>
          </div>
        </div>
        
      </div>
    </div>
  </body>
</html>
